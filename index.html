<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="calculator">
        <div id="display">
            <input type="text" class="operation" readonly>
            <input type="text" class="result" readonly placeholder="0">
        </div>
    
        <div class="row first-row">
            <button class="delete-button">⌫</button>
            <button class="clear-button">AC</button>
            <button class="percentage">%</button>
            <button class="divide operator-btn">÷</button>
        </div>
        <div class="row second-row">
            <button class="button-seven number-btn">7</button>
            <button class="button-eight number-btn">8</button>
            <button class="button-nine number-btn">9</button>
            <button class="multiply operator-btn">x</button>
        </div>
        <div class="row third-row">
            <button class="button-four number-btn">4</button>
            <button class="button-five number-btn">5</button>
            <button class="button-six number-btn">6</button>
            <button class="subtraction operator-btn">–</button>
        </div>
        <div class="row fourth-row">
            <button class="button-one number-btn">1</button>
            <button class="button-two number-btn">2</button>
            <button class="button-three number-btn">3</button>
            <button class="addition operator-btn">+</button>
        </div>
        <div class="row fifth-row">
            <button class="change-sign-button">+/-</button>
            <button class="button-zero number-btn">0</button>
            <button class="decimal-button">.</button>
            <button class="equal-button">=</button>
        </div>
    </div>
</body>
</html>
